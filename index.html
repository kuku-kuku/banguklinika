<head>

  <title>Odontologijos klinika (stomatologijos) Klaipėdoje</title>
  
  <script>
    // Defer GTM until after first paint + user interaction (or 4s max).
    // GTM's ~477KB of JS was blocking the main thread on mobile
    // (contributing ~500ms TBT). Analytics still fires — just not during LCP.
    (function () {
      var loaded = false;
      function loadGTM() {
        if (loaded) return; loaded = true;
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-W5NM62RK';
        document.head.appendChild(s);
        ['scroll','pointerdown','keydown','touchstart'].forEach(function (ev) {
          window.removeEventListener(ev, loadGTM, { passive: true });
        });
      }
      ['scroll','pointerdown','keydown','touchstart'].forEach(function (ev) {
        window.addEventListener(ev, loadGTM, { passive: true, once: true });
      });
      // Fallback: load anyway after 4s so headless crawlers / Lighthouse still get GTM.
      setTimeout(loadGTM, 4000);
    })();
  </script>

  <script>
    (function () {
      try {
        var h = window.location.hash || "";
        if (/#(invite_token|confirmation_token)=/.test(h)) {
          window.location.replace("/admin/" + h);
        }
      } catch (e) { }
    })();
  </script>
</head>
